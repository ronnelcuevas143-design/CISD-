<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTF CISD Scanner</title>
<style>
:root{--bg:#0f141b;--card:#171e28;--line:#26303d;--tx:#e6ebf2;--mu:#8795a8;--g:#2fbf9b;--r:#ef6a5b;--a:#e5b04a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px 12px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:18px;margin:0;font-weight:700}
#st{color:var(--mu);font-size:12px}
h1 small{color:var(--mu);font-size:11px;font-weight:400}
button{background:var(--line);color:var(--tx);border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;font-size:17px;font-variant-numeric:tabular-nums;margin-bottom:6px}
.hd span{color:var(--mu)}
.row{border-top:1px solid var(--line);padding:10px 0 4px;border-left:3px solid transparent;padding-left:9px}
.row.g{border-left-color:var(--g)}.row.r{border-left-color:var(--r)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{color:var(--mu);font-size:12px}
a{color:#7db3ff;text-decoration:none}
.hd a{color:var(--tx);text-decoration:underline;text-decoration-color:var(--mu)}
.st{font-weight:700;font-size:13px}
.s0{color:var(--mu)}.s1,.s2,.s3,.s4{color:var(--a)}.s5.g{color:var(--g)}.s5.r{color:var(--r)}
.dots{display:flex;gap:6px;margin:7px 0}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.row.g .dots i.on{background:var(--g)}.row.r .dots i.on{background:var(--r)}
.dl{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;margin-bottom:6px}
.w{font-size:13.5px;font-variant-numeric:tabular-nums}
.x{font-size:12.5px;color:var(--mu);margin-top:3px;font-variant-numeric:tabular-nums}
.ent{background:#0f141b;border-radius:8px;padding:8px;margin-top:6px;font-size:13px;color:var(--tx)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
summary{font-size:14px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,textarea,select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px}
.btns{display:flex;gap:8px;margin-top:10px}
.hr{border-top:1px solid var(--line);padding:8px 0 2px 8px;border-left:3px solid transparent;font-size:13px}.hr.g{border-left-color:var(--g)}.hr.r{border-left-color:var(--r)}
.hr span{float:right;font-weight:700}.hr.g span{color:var(--g)}.hr.r span{color:var(--r)}
</style></head><body>
<header><h1>MTF CISD Scanner <small>v7</small></h1><div><span id="st"></span> <button id="rf">Scan</button></div></header>
<details><summary>Settings at alerts</summary>
<label>Pairs (Binance, comma separated)</label><textarea id="pairs" rows="2"></textarea>
<label>Telegram bot token (optional)</label><input id="tg" autocomplete="off">
<label>Telegram chat ID (optional)</label><input id="chat" autocomplete="off">
<label>Discord webhook URL (optional)</label><input id="dc" autocomplete="off">
<label>SL basis</label><select id="slb"><option value="mid">Mid TF low/high</option><option value="ltf">LTF low/high (mas masikip)</option></select>
<label>Reward : Risk para sa TP</label><input id="rr" type="number" step="0.5" min="0.5">
<div class="btns"><button id="save">Save</button><button id="perm">Enable notifications</button><button id="test">Test alert</button></div>
</details>
<details id="hd"><summary>History (Win / Loss)</summary><div id="hist"></div><div class="btns"><button id="clr">Clear history</button></div></details>
<div id="list"></div>
<script>
const SETS=[{n:'A',h:'1d',m:'1h',l:'5m'},{n:'B',h:'4h',m:'15m',l:'1m'}];
const HOSTS=['https://api.binance.com','https://data-api.binance.vision'];
let host=0;
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg=store.get('cfg',{pairs:['BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT','BNBUSDT'],tg:'',chat:'',dc:''});
cfg.slb=cfg.slb||'mid';cfg.rr=cfg.rr||2;
let last=store.get('stages',{});
const IV={'1d':'D','4h':'240','1h':'60','15m':'15','5m':'5','1m':'1'};
const tv=(sym,iv)=>'<a target="_blank" rel="noopener" href="https://www.tradingview.com/chart/?symbol=BINANCE:'+sym+'&interval='+IV[iv]+'">'+iv+'</a>';
const f=x=>x>=100?x.toFixed(2):x>=1?x.toFixed(4):x.toFixed(6);

async function kl(sym,iv,limit){
  for(let t=0;t<HOSTS.length;t++){
    const i=(host+t)%HOSTS.length;
    try{
      const r=await fetch(HOSTS[i]+'/api/v3/klines?symbol='+sym+'&interval='+iv+'&limit='+limit);
      if(!r.ok)continue;
      host=i;
      const a=await r.json();
      return a.map(k=>({t:k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],ct:k[6]}));
    }catch(e){}
  }
  throw new Error('fetch');
}

// CISD: level = open of the last opposite-color candle right before the final leg.
// Bull: last green candle before the red leg; close above its open = bullish CISD.
// Bear: last red candle before the green leg; close below its open = bearish CISD.
function cisd(cs){
  let lb=null,lu=null,run=null,res=null,gO=null,rO=null;const evs=[];
  cs.forEach(k=>{
    const d=k.c>k.o?1:k.c<k.o?-1:0; if(!d)return;
    if(d>0&&lb&&k.c>lb.so){res={dir:1,t:k.t,ct:k.ct,c:k.c,sl:lb.ext};evs.push(res);lb=null}
    if(d<0&&lu&&k.c<lu.so){res={dir:-1,t:k.t,ct:k.ct,c:k.c,sl:lu.ext};evs.push(res);lu=null}
    if(!run||run.d!==d)run={d,ref:d<0?gO:rO,ext:d>0?k.h:k.l};
    run.ext=d>0?Math.max(run.ext,k.h):Math.min(run.ext,k.l);
    if(d<0&&run.ref!=null)lb={so:run.ref,ext:run.ext};
    if(d>0&&run.ref!=null)lu={so:run.ref,ext:run.ext};
    if(d>0)gO=k.o;else rO=k.o;
  });
  return{res,evs,bull:lb,bear:lu};
}

const LAB=['No bias','Bias set','POI touched','Mid CISD done','FVG touched','ENTRY'];
function fvgs(cs,dir){const o=[];for(let i=2;i<cs.length;i++){const a=cs[i-2],c=cs[i];
  if(dir>0&&a.h<c.l)o.push({lo:a.h,hi:c.l,i,t:c.t,ct:c.ct,ty:'FVG'});
  if(dir<0&&a.l>c.h)o.push({lo:c.h,hi:a.l,i,t:c.t,ct:c.ct,ty:'FVG'});}return o}
function obs(cs,dir){const o=[];for(let i=0;i<cs.length-1;i++){const k=cs[i],n=cs[i+1];
  if(dir>0&&k.c<k.o&&n.c>k.h)o.push({lo:k.l,hi:k.h,i:i+1,t:n.t,ct:n.ct,ty:'OB'});
  if(dir<0&&k.c>k.o&&n.c<k.l)o.push({lo:k.l,hi:k.h,i:i+1,t:n.t,ct:n.ct,ty:'OB'});}return o}
const filled=(z,cs,dir)=>cs.some((k,j)=>j>z.i&&(z.ty==='FVG'?(dir>0?k.l<=z.lo:k.h>=z.hi):(dir>0?k.c<z.lo:k.c>z.hi)));
const zr=z=>f(z.lo)+' - '+f(z.hi);

let ents=store.get('ents',{});
let ends=store.get('ends',{});
let hist=store.get('hist',[]),seen=store.get('seen',{});
function renderHist(){
  const w=hist.filter(x=>x.out==='TP').length,ls=hist.filter(x=>x.out==='SL').length,v=hist.length-w-ls;
  const tot=hist.reduce((a,x)=>a+x.R,0),wr=w+ls?Math.round(w/(w+ls)*100):0;
  $('#hist').innerHTML='<div class="x">Wins '+w+' | Loss '+ls+' | Void '+v+' | Win rate '+wr+'% | Total '+(tot>=0?'+':'')+tot.toFixed(2)+'R</div>'
    +(hist.slice(0,30).map(x=>'<div class="hr '+(x.out==='TP'?'g':x.out==='SL'?'r':'')+'"><b>'+x.sym.replace('USDT','')+'</b> '+x.tf+' '+(x.dir>0?'LONG':'SHORT')+' <span>'+x.out+' '+(x.R>=0?'+':'')+x.R+'R</span><div class="x">'+new Date(x.t).toLocaleString()+' | '+f(x.entry)+' > '+(x.out==='TP'?f(x.tp):x.out==='SL'?f(x.sl):'void')+(x.poi?' | '+x.poi:'')+'</div></div>').join('')||'<div class="x">Wala pang history.</div>');
}
function lock(r,e){
  const s=r.set,bull=e.bias>0;
  r.stage=5;r.bias=e.bias;r.pty=(e.poi||'').split(' ')[0];r.note='';
  const R=(r.price-e.entry)/Math.abs(e.entry-e.sl)*e.bias;
  r.watch='ENTRY bukas pa mula '+new Date(e.ct).toLocaleTimeString()+'. Wala pang TP o SL. Ngayon: '+R.toFixed(2)+'R.';
  r.extra='<div class="ent">Entry '+f(e.entry)+' | SL '+f(e.sl)+' ('+(e.slb==='ltf'?s.l:s.m)+' '+(bull?'low':'high')+') | TP '+(e.rr||2)+'R '+f(e.tp)+'</div>'+(e.poi?'POI touched: '+e.poi+'. '+s.m+' FVG: '+e.fvg+'.<br>':'')+'Natatapos kapag natamaan ang SL '+f(e.sl)+' o TP '+f(e.tp)+', o kapag bias void.';
  return r;
}
async function analyze(sym,s){
  const key=sym+s.n,ent=ents[key];
  const [H,M,L]=await Promise.all([kl(sym,s.h,45),kl(sym,s.m,150),kl(sym,s.l,ent?1000:300)]);
  const now=Date.now(),cl=a=>a.filter(k=>k.ct<now);
  const h=cl(H),m=cl(M),l=cl(L),price=L[L.length-1].c;
  const a=h[h.length-1],p=h[h.length-2];
  const r={set:s,sym,price,stage:0,bias:0,watch:'',extra:'',note:''};
  const en=ends[key];if(en&&Date.now()-en.at<432e5)r.note='Huling setup tapos: '+en.why+' ('+new Date(en.at).toLocaleTimeString()+')';
  if(a.c>p.h)r.bias=1;else if(a.c<p.l)r.bias=-1;
  const resolve=e=>{for(const k of L){if(k.t<=e.ct)continue;const sl=e.bias>0?k.l<=e.sl:k.h>=e.sl,tp=e.bias>0?k.h>=e.tp:k.l<=e.tp;if(sl)return{o:'SL',t:k.t};if(tp)return{o:'TP',t:k.t}}return null};
  if(ent){
    let why='',res=null;
    if(ent.bias!==r.bias)why='Bias void';
    else if(ent.ct<l[0].t)why='Expired (luma na ang data)';
    else{res=resolve(ent);if(res)why=res.o==='TP'?'TP hit':'SL hit'}
    if(why){
      const risk=Math.abs(ent.entry-ent.sl)||1,R=res?(res.o==='TP'?(ent.rr||2):-1):(price-ent.entry)*ent.bias/risk;
      hist.unshift({sym,set:s.n,tf:s.h+'/'+s.m+'/'+s.l,dir:ent.bias,entry:ent.entry,sl:ent.sl,tp:ent.tp,t:ent.ct,end:res?res.t:Date.now(),out:res?res.o:'VOID',R:+R.toFixed(2),poi:ent.poi||''});
      if(hist.length>300)hist.length=300;
      seen[key+':'+ent.ct]=1;store.set('hist',hist);store.set('seen',seen);
      delete ents[key];store.set('ents',ents);
      r.ended=why+' ('+(R>=0?'+':'')+R.toFixed(2)+'R)';
      ends[key]={why:r.ended,at:Date.now()};store.set('ends',ends);
      r.note='Huling setup tapos: '+r.ended+' ('+new Date().toLocaleTimeString()+')';
    }else return lock(r,ent);
  }
  if(!r.bias){
    r.watch='Walang bias. Hintayin ang '+s.h+' close above '+f(p.h)+' (bull) o below '+f(p.l)+' (bear).';
    return r;
  }
  const dir=r.bias,bull=dir>0;
  r.stage=1;
  r.extra='Bias void kapag nag-close ang '+s.h+' '+(bull?'below '+f(p.h):'above '+f(p.l))+'.';
  const hc=h.slice(-30),M1=cisd(m),L1=cisd(l);
  const dist=z=>price>z.hi?price-z.hi:price<z.lo?z.lo-price:0;
  const zs=fvgs(hc,dir).concat(obs(hc,dir)).filter(z=>!filled(z,hc,dir)&&(bull?z.lo<=price:z.hi>=price)).sort((x,y)=>dist(x)-dist(y)).slice(0,4);
  const run=z=>{
    const mt=M.find(k=>k.t>a.ct&&k.l<=z.hi&&k.h>=z.lo);
    if(!mt)return{st:1,watch:'Hintayin ang presyo sa '+s.h+' '+z.ty+' '+zr(z)+'.'};
    const me=M1.evs.find(e=>e.dir===dir&&e.t>mt.t);
    if(!me){const lv=bull?M1.bull:M1.bear;return{st:2,watch:s.h+' '+z.ty+' '+zr(z)+' touched. '+(lv?s.m+' close '+(bull?'above ':'below ')+f(lv.so)+' = CISD.':'Hintayin ang '+s.m+' CISD.')}}
    const g=fvgs(m,dir).filter(x=>x.t>=mt.t&&!filled(x,m,dir)).pop();
    if(!g)return{st:3,watch:s.m+' CISD done pero wala pang '+s.m+' FVG. Hintayin ang bagong FVG.'};
    const lt=L.find(k=>k.t>Math.max(me.ct,g.ct)&&k.l<=g.hi&&k.h>=g.lo);
    if(!lt)return{st:3,watch:s.m+' CISD done. Hintayin ang '+s.l+' sa '+s.m+' FVG '+zr(g)+'.'};
    const evs=L1.evs.filter(e=>e.dir===dir&&e.t>lt.t);
    const ne=evs.map(e=>{const sl=cfg.slb==='ltf'?e.sl:me.sl;return{bias:dir,entry:e.c,sl,tp:e.c+dir*cfg.rr*Math.abs(e.c-sl),ct:e.ct,slb:cfg.slb,rr:cfg.rr,poi:z.ty+' '+zr(z)+' ('+s.h+')',fvg:zr(g)}}).find(x=>Math.abs(x.entry-x.sl)>0&&(bull?x.entry>x.sl:x.entry<x.sl)&&!seen[key+':'+x.ct]&&!resolve(x));
    if(ne)return{st:5,ne};
    const lv=bull?L1.bull:L1.bear;
    return{st:4,watch:s.m+' FVG touched. '+(evs.length?s.l+' CISD naganap pero tapos na (TP/SL). Hintayin ang bago.':lv?s.l+' close '+(bull?'above ':'below ')+f(lv.so)+' = CISD, entry na.':'Hintayin ang '+s.l+' CISD.')};
  };
  let best=null;
  for(const z of zs){const o=run(z);o.ty=z.ty;if(!best||o.st>best.st)best=o}
  if(!best){r.watch='Walang unfilled FVG/OB na kapareho ng bias sa huling 30 '+s.h+' candles.';return r}
  if(best.st===5){ents[key]=best.ne;store.set('ents',ents);return lock(r,best.ne)}
  r.stage=best.st;r.watch=best.watch;r.pty=best.st>=2?best.ty:'';
  return r;
}

function row(r){
  const s=r.set,b=r.bias,cls=b>0?'g':b<0?'r':'';
  const lab=LAB[r.stage]+(b?(b>0?' (bull)':' (bear)'):'');
  const dots=[0,1,2,3,4].map(i=>'<i class="'+(i<r.stage?'on':'')+'"></i>').join('');
  return '<div class="row '+cls+'"><div class="top"><span class="tag">'+tv(r.sym,s.h)+' / '+tv(r.sym,s.m)+' / '+tv(r.sym,s.l)+'</span><span class="st s'+r.stage+' '+cls+'">'+lab+'</span></div>'
    +'<div class="dots">'+dots+'</div><div class="dl"><span>Bias</span><span>'+(r.pty?'POI '+r.pty:'POI')+'</span><span>'+s.m+' CISD</span><span>'+s.m+' FVG</span><span>'+s.l+' CISD</span></div>'
    +'<div class="w">'+r.watch+'</div><div class="x">'+r.extra+'</div>'+(r.note?'<div class="x">'+r.note+'</div>':'')+'</div>';
}
function card(sym,rs){
  return '<div class="c"><div class="hd"><b><a target="_blank" rel="noopener" href="https://www.tradingview.com/chart/?symbol=BINANCE:'+sym+'">'+sym.replace('USDT','')+'</a></b><span>'+f(rs[0].price)+'</span></div>'+rs.map(row).join('')+'</div>';
}

let swReg=null;
try{if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{swReg=r}).catch(()=>{})}catch(e){}
async function pop(msg){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    let reg=swReg;
    if(!reg&&'serviceWorker' in navigator)reg=await navigator.serviceWorker.getRegistration();
    if(reg&&reg.showNotification)await reg.showNotification('CISD Scanner',{body:msg,vibrate:[200,100,200],tag:msg});
    else new Notification('CISD Scanner',{body:msg});
  }catch(e){}
}
function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},400)}catch(e){}}
async function notify(msg){
  beep();
  await pop(msg);
  if(cfg.tg&&cfg.chat){try{await fetch('https://api.telegram.org/bot'+cfg.tg+'/sendMessage?chat_id='+encodeURIComponent(cfg.chat)+'&text='+encodeURIComponent(msg))}catch(e){}}
  if(cfg.dc){try{await fetch(cfg.dc,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:msg})})}catch(e){}}
}

let busy=false;
async function scan(){
  if(busy)return;busy=true;
  $('#st').textContent='Scanning...';
  const out=[];
  for(const sym of cfg.pairs){
    try{
      const rs=await Promise.all(SETS.map(s=>analyze(sym,s)));
      rs.forEach(r=>{
        const k=sym+r.set.n,prev=last[k];
        if(r.ended)notify(sym+' Set '+r.set.n+': '+r.ended+'. Tapos na ang setup.');
        if(prev!==undefined&&r.stage>prev&&r.stage>=2){
          const dir=r.bias>0?'BULL':'BEAR';
          notify(r.stage===5?sym+' Set '+r.set.n+' ENTRY '+dir+' @ '+f(r.price):sym+' Set '+r.set.n+' '+LAB[r.stage]+' '+dir+'. Next: '+r.watch);
        }
        last[k]=r.stage;
      });
      out.push(card(sym,rs));
    }catch(e){out.push('<div class="c"><b>'+sym+'</b> <span class="tag">Hindi ma-load. Check ang pair name o connection.</span></div>')}
  }
  store.set('stages',last);
  $('#list').innerHTML=out.join('');renderHist();
  $('#st').textContent='Updated '+new Date().toLocaleTimeString();
  busy=false;
}

$('#pairs').value=cfg.pairs.join(', ');$('#slb').value=cfg.slb;$('#rr').value=cfg.rr;$('#tg').value=cfg.tg;$('#chat').value=cfg.chat;$('#dc').value=cfg.dc;
$('#save').onclick=()=>{
  cfg.pairs=$('#pairs').value.toUpperCase().split(/[\s,]+/).map(x=>x.replace(/[^A-Z0-9]/g,'')).filter(Boolean).map(x=>x.endsWith('USDT')?x:x+'USDT');
  cfg.slb=$('#slb').value;cfg.rr=+$('#rr').value||2;cfg.tg=$('#tg').value.trim();cfg.chat=$('#chat').value.trim();cfg.dc=$('#dc').value.trim();
  store.set('cfg',cfg);scan();
};
$('#perm').onclick=async()=>{try{const p=await Notification.requestPermission();if(p==='granted')notify('Naka-on na ang notifications')}catch(e){}};
$('#test').onclick=()=>notify('Test alert from CISD Scanner');
$('#rf').onclick=scan;
$('#clr').onclick=()=>{hist=[];store.set('hist',hist);renderHist()};
try{if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
scan();setInterval(scan,60000);
</script></body></html>
