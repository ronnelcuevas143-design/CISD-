<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MTF CISD Scanner</title>
<style>
:root{--bg:#0f141b;--card:#171e28;--line:#26303d;--tx:#e6ebf2;--mu:#8795a8;--g:#2fbf9b;--r:#ef6a5b;--a:#e5b04a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px 12px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{font-size:18px;margin:0;font-weight:700}
#st{color:var(--mu);font-size:12px}
button{background:var(--line);color:var(--tx);border:0;border-radius:8px;padding:8px 12px;font:inherit;font-size:13px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;font-size:17px;font-variant-numeric:tabular-nums;margin-bottom:6px}
.hd span{color:var(--mu)}
.row{border-top:1px solid var(--line);padding:10px 0 4px;border-left:3px solid transparent;padding-left:9px}
.row.g{border-left-color:var(--g)}.row.r{border-left-color:var(--r)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{color:var(--mu);font-size:12px}
a{color:#7db3ff;text-decoration:none}
.hd a{color:var(--tx);text-decoration:underline;text-decoration-color:var(--mu)}
.st{font-weight:700;font-size:13px}
.s0{color:var(--mu)}.s1,.s2{color:var(--a)}.s3.g{color:var(--g)}.s3.r{color:var(--r)}
.dots{display:flex;gap:6px;margin:7px 0}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.row.g .dots i.on{background:var(--g)}.row.r .dots i.on{background:var(--r)}
.dl{display:flex;justify-content:space-between;color:var(--mu);font-size:11px;margin-bottom:6px}
.w{font-size:13.5px;font-variant-numeric:tabular-nums}
.x{font-size:12.5px;color:var(--mu);margin-top:3px;font-variant-numeric:tabular-nums}
.ent{background:#0f141b;border-radius:8px;padding:8px;margin-top:6px;font-size:13px;color:var(--tx)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
summary{font-size:14px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:14px}
.btns{display:flex;gap:8px;margin-top:10px}
</style></head><body>
